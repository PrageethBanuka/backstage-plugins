apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-openchoreo-endpoint
  title: Endpoint
  description: >-
    Create an Endpoint that routes a project's traffic to one or more
    components with weights, for gateway and in-cluster callers alike. Run a
    canary, blue/green or A/B test on it later from its page.
spec:
  owner: openchoreo-users
  type: Endpoint
  # Enable user token injection for user-based authorization at OpenChoreo API
  EXPERIMENTAL_formDecorators:
    - id: openchoreo:inject-user-token
  parameters:
    - title: Endpoint
      required:
        - project_namespace
        - endpoint_name
        - typeKind
        - typeName
      properties:
        project_namespace:
          title: Project & Namespace
          type: object
          ui:field: ProjectNamespaceField
          properties:
            project_name:
              type: string
            namespace_name:
              type: string
          required:
            - project_name
            - namespace_name
        endpoint_name:
          title: Name
          type: string
          description: Unique name for the Endpoint, for example payments-api
          ui:field: ResourceNamePicker
          ui:options:
            catalogKind: Endpoint
            resourceLabel: Endpoint
            namespaceField: project_namespace.namespace_name
        displayName:
          title: Display Name
          type: string
        description:
          title: Description
          type: string
        typeName:
          title: Route type
          type: string
          description: How the platform serves this Endpoint. Keep http unless your platform team gave you another type.
          default: http
        typeKind:
          title: Route type scope
          type: string
          enum: [ClusterEndpointType, EndpointType]
          default: ClusterEndpointType
          ui:widget: hidden
    - title: Reach and version
      required:
        - endpointRouting
      properties:
        endpointRouting:
          title: Reach and version
          description: >-
            Where the Endpoint is reachable from, and the component that
            serves it. One is enough: a canary, blue/green or A/B test adds
            the new version later from the Endpoint's Rollout tab.
          type: object
          ui:field: EndpointBackendsField
          ui:options:
            projectField: project_namespace
        pathPrefix:
          title: Path
          type: string
          description: Path clients call on the gateway, for example /payments. Defaults to /<name>.
          pattern: '^/[a-z0-9]([-a-z0-9/._]*[a-z0-9])?$'
        autoDeploy:
          title: Deploy each release to the first environment
          type: boolean
          default: true
  steps:
    - id: create-endpoint
      name: Create OpenChoreo Endpoint
      action: openchoreo:endpoint:create
      input:
        namespaceName: ${{ parameters.project_namespace.namespace_name }}
        projectName: ${{ parameters.project_namespace.project_name }}
        endpointName: ${{ parameters.endpoint_name }}
        displayName: ${{ parameters.displayName }}
        description: ${{ parameters.description }}
        typeKind: ${{ parameters.typeKind }}
        typeName: ${{ parameters.typeName }}
        backends: ${{ parameters.endpointRouting.backends }}
        visibility: ${{ parameters.endpointRouting.visibility }}
        autoDeploy: ${{ parameters.autoDeploy }}
        parameters:
          pathPrefix: ${{ parameters.pathPrefix }}
  output:
    links:
      - title: View Endpoint
        icon: kind:endpoint
        entityRef: ${{ steps['create-endpoint'].output.entityRef }}
